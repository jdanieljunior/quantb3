name: QuantB3 - Sinais Segunda-feira

on:
  schedule:
    # Toda segunda às 21:30 UTC (18:30 BRT)
    - cron: '30 21 * * 1'
  workflow_dispatch:
    inputs:
      signal_date:
        description: 'Data do sinal (YYYY-MM-DD, default: hoje)'
        required: false
        default: ''

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar job de sinais
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SIGNAL_DATE: ${{ github.event.inputs.signal_date }}
        run: |
          python -c "
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from src.jobs.monday import run_monday_job

          signal_date_str = os.environ.get('SIGNAL_DATE', '')
          if signal_date_str:
              signal_date = datetime.strptime(signal_date_str, '%Y-%m-%d').date()
          else:
              signal_date = datetime.now(ZoneInfo('America/Sao_Paulo')).date()

          result = run_monday_job(signal_date=signal_date)
          print(f'Status: {result[\"status\"]}')
          print(f'Top tickers: {result.get(\"top_tickers\", [])}')
          "

      - name: Notificar falha
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')
          if token and chat_id:
              requests.post(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  json={'chat_id': chat_id, 'text': '🚨 QuantB3: Job de SINAIS (segunda) FALHOU!'}
              )
          "
